name: Capture legacy bootstrap

"on":
  workflow_dispatch:
    inputs:
      captured_at:
        description: "UTC RFC3339 timestamp for this immutable capture attempt"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: capture-legacy-2026-08-bootstrap
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.6"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Capture the reviewed legacy matrix
        env:
          CAPTURED_AT: ${{ inputs.captured_at }}
          CAPTURE_ROOT: upstream/packages.geldata.com/legacy-2026-08-bootstrap
        run: |
          set -euo pipefail
          test "$CAPTURE_ROOT" = "upstream/packages.geldata.com/legacy-2026-08-bootstrap"
          uv run gel-registry capture --repo . --captured-at "$CAPTURED_AT"
          test -f "$CAPTURE_ROOT/capture.json"

      - name: Normalize and validate the pre-publication candidate locally
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          uv run gel-registry normalize --repo .
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          base="$(git merge-base HEAD "refs/remotes/origin/$DEFAULT_BRANCH")"
          tree="$RUNNER_TEMP/gel-registry-capture-base"
          mkdir -p "$tree"
          git archive "$base" | tar -x -C "$tree"
          uv run gel-registry validate-capture --repo . --base "$tree"

      - name: Prepare the immutable capture branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          branch="capture/legacy-2026-08-bootstrap"
          git fetch --no-tags origin "$DEFAULT_BRANCH"

          remote_exists=false
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            remote_exists=true
            git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
            if ! git diff --quiet "refs/remotes/origin/$branch" -- upstream bootstrap; then
              echo "remote $branch contains different capture bytes; inspect that branch before rerunning" >&2
              exit 1
            fi
            git switch --detach "refs/remotes/origin/$branch"
            git switch -C "$branch"
          else
            git switch -c "$branch"
          fi

          git add -- upstream bootstrap
          unexpected="$(git diff --cached --name-only | awk '$0 !~ /^(upstream|bootstrap)\//')"
          if [[ -n "$unexpected" ]]; then
            echo "capture branch staged an unexpected path: $unexpected" >&2
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m "data: capture legacy package indexes"
            if [[ "$remote_exists" == true ]]; then
              git push origin "$branch"
            else
              git push --set-upstream origin "$branch"
            fi
          fi

      - name: Open or reuse the capture pull request
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          branch="capture/legacy-2026-08-bootstrap"
          number="$(gh pr list --state open --head "$branch" --base "$DEFAULT_BRANCH" --json number --jq '.[0].number')"
          if [[ -z "$number" ]]; then
            gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$branch" \
              --title "data: capture legacy package indexes" \
              --body "Review the immutable legacy capture and normalized bootstrap indexes."
          else
            echo "reusing capture pull request #$number"
          fi
