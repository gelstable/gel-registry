name: Publish legacy bootstrap

"on":
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish-legacy-2026-08-bootstrap
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.6"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Require the reviewed capture and bootstrap inputs
        env:
          CAPTURE_ROOT: upstream/packages.geldata.com/legacy-2026-08-bootstrap
        run: |
          set -euo pipefail
          test -f "$CAPTURE_ROOT/capture.json"
          test -d bootstrap
          test -n "$(find bootstrap -type f -name '*.json' -print -quit)"

      - name: Render canonical support documents
        run: >-
          uv run python -c
          'from pathlib import Path; from gel_registry.render import render_schemas;
          render_schemas(Path("."))'

      - name: Build and select the nonempty bootstrap snapshot
        run: |
          set -euo pipefail
          uv run gel-registry publish-bootstrap --repo .
          uv run gel-registry validate --repo .
          snapshot="$(jq -er '.snapshot | select(type == "string" and length > 0)' pointers/latest.json)"
          test -n "$snapshot"
          test -d "public/s/$snapshot/index"
          test -n "$(find "public/s/$snapshot/index" -type f -name '*.json' -print -quit)"

      - name: Prepare the publication branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          branch="publish/legacy-2026-08-bootstrap"
          git fetch --no-tags origin "$DEFAULT_BRANCH"

          remote_exists=false
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            remote_exists=true
            git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
            if ! git diff --quiet "refs/remotes/origin/$branch" -- pointers public; then
              echo "remote $branch contains different publication bytes; inspect that branch before rerunning" >&2
              exit 1
            fi
            git switch --detach "refs/remotes/origin/$branch"
            git switch -C "$branch"
          else
            git switch -c "$branch"
          fi

          git add -- pointers public
          unexpected="$(git diff --cached --name-only | awk '$0 !~ /^(pointers|public)\//')"
          if [[ -n "$unexpected" ]]; then
            echo "publication branch staged an unexpected path: $unexpected" >&2
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m "data: publish legacy bootstrap snapshot"
            if [[ "$remote_exists" == true ]]; then
              git push origin "$branch"
            else
              git push --set-upstream origin "$branch"
            fi
            publication_pending=true
          elif [[ "$remote_exists" == true ]] && (( $(git rev-list --count "refs/remotes/origin/$DEFAULT_BRANCH..HEAD") > 0 )); then
            publication_pending=true
          else
            publication_pending=false
          fi
          echo "PUBLICATION_PENDING=$publication_pending" >> "$GITHUB_ENV"

      - name: Open or reuse the publication pull request
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          branch="publish/legacy-2026-08-bootstrap"
          number="$(gh pr list --state open --head "$branch" --base "$DEFAULT_BRANCH" --json number --jq '.[0].number')"
          if [[ -z "$number" ]]; then
            if [[ "${PUBLICATION_PENDING:-false}" != true ]]; then
              echo "bootstrap publication is already present; no pull request is needed"
              exit 0
            fi
            gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$branch" \
              --title "data: publish legacy bootstrap snapshot" \
              --body "Review the first nonempty snapshot selection and moving public documents."
          else
            echo "reusing publication pull request #$number"
          fi
