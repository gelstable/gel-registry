name: Promote stable Gel CLI releases

"on":
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: promote-gel-cli
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      attestations: read
    steps:
      - name: Check out the default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.6"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Promote one verified release per branch
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          if ! discovered_tags="$(
            gh api --paginate repos/gelstable/gel-cli/releases \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
              | while IFS= read -r tag; do
                  if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
                    printf '%s\n' "$tag"
                  fi
                done \
              | sort -Vu
          )"; then
            echo "could not discover stable Gel CLI releases" >&2
            exit 1
          fi
          tags=()
          if [[ -n "$discovered_tags" ]]; then
            mapfile -t tags <<<"$discovered_tags"
          fi

          if (( ${#tags[@]} == 0 )); then
            echo "no stable Gel CLI releases discovered"
            exit 0
          fi

          for tag in "${tags[@]}"; do
            version="${tag#v}"
            record="releases/gel-cli/$version.json"
            if [[ -f "$record" ]]; then
              echo "release $tag is already recorded"
              continue
            fi

            branch="promote/gel-cli-$version"
            remote_exists=false
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              remote_exists=true
              git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
              git switch --detach "refs/remotes/origin/$branch"
              git switch -C "$branch"
            else
              git fetch --no-tags origin "$DEFAULT_BRANCH"
              git switch --detach "refs/remotes/origin/$DEFAULT_BRANCH"
              git switch -c "$branch"
            fi

            if [[ -n "$(git status --porcelain)" ]]; then
              echo "promotion branch $branch is not clean" >&2
              exit 1
            fi

            uv run gel-registry promote --repo . --release-tag "$tag"
            uv run gel-registry validate --repo .

            git add -- releases/gel-cli pointers public
            unexpected="$(git diff --cached --name-only | awk '$0 !~ /^(releases\/gel-cli|pointers|public)\//')"
            if [[ -n "$unexpected" ]]; then
              echo "promotion branch staged an unexpected path: $unexpected" >&2
              exit 1
            fi
            if ! git diff --cached --quiet; then
              git commit -m "data: promote gel-cli $version"
              if [[ "$remote_exists" == true ]]; then
                git push origin "$branch"
              else
                git push --set-upstream origin "$branch"
              fi
            fi

            number="$(gh pr list --state open --head "$branch" --base "$DEFAULT_BRANCH" --json number --jq '.[0].number')"
            if [[ -z "$number" ]]; then
              gh pr create \
                --base "$DEFAULT_BRANCH" \
                --head "$branch" \
                --title "data: promote gel-cli $version" \
                --body "Review the verified stable Gel CLI release record and immutable snapshot."
            else
              echo "reusing promotion pull request #$number"
            fi

            git fetch --no-tags origin "$DEFAULT_BRANCH"
            git switch --detach "refs/remotes/origin/$DEFAULT_BRANCH"
          done
