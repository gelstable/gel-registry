name: Promote rolling registry candidate

"on":
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: promote-registry
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      attestations: read
    steps:
      - name: Check out the default branch
        # This job pushes the rolling candidate branch, so unlike every other
        # checkout here it needs the credentials git leaves behind.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # zizmor: ignore[artipacked]
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.6"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Promote rolling registry candidate
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: uv run python .github/scripts/promote.py
