[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "gel-registry"
version = "0.1.0"
description = "Static registry source and rendering tools for Gelstable"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28,<1",
    "packaging>=25,<26",
    "pydantic>=2.11,<3",
    "tomli-w>=1.2,<2",
]

[project.scripts]
gel-registry = "gel_registry.__main__:main"

[dependency-groups]
dev = [
    "hypothesis>=6.140,<7",
    "mypy>=1.17,<2",
    "pytest-httpx>=0.35,<1",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
    "zizmor>=1.29,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gel_registry"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = false
warn_required_dynamic_aliases = true
warn_untyped_fields = true
